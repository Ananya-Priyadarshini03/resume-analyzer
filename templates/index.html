<!DOCTYPE html>
<html>
<head>
<title>Resume Analyzer</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {background:#667eea;color:white;text-align:center;}
.drop-zone {border:2px dashed white;padding:30px;margin:20px;cursor:pointer;}
.results {background:white;color:black;padding:20px;display:none;}
.skill-bar {background:#ddd;}
.skill-fill {background:green;color:white;}
</style>
</head>

<body>

<h1>Resume Analyzer</h1>

<div class="drop-zone" id="dropZone">
Drag & Drop or Click
<input type="file" id="fileInput" hidden>
</div>

<button onclick="uploadResume()">Analyze</button>

<div class="results" id="results">
<h2>Score: <span id="score"></span></h2>

<ul id="roles"></ul>
<div id="skills"></div>
<canvas id="chart"></canvas>
<pre id="ai"></pre>
</div>

<script>
let file=null;
const dropZone=document.getElementById("dropZone");
const fileInput=document.getElementById("fileInput");

dropZone.onclick=()=>fileInput.click();

fileInput.onchange=()=>{
file=fileInput.files[0];
dropZone.innerText=file.name;
};

dropZone.ondrop=e=>{
e.preventDefault();
file=e.dataTransfer.files[0];
dropZone.innerText=file.name;
};

dropZone.ondragover=e=>e.preventDefault();

async function uploadResume(){
if(!file){alert("Upload file");return;}

const formData=new FormData();
formData.append("resume",file);

const res=await fetch("/analyze",{method:"POST",body:formData});
const data=await res.json();

if(!data.success){alert(data.error);return;}

document.getElementById("results").style.display="block";
document.getElementById("score").innerText=data.score;

document.getElementById("roles").innerHTML=data.roles.map(r=>`<li>${r}</li>`).join("");

let labels=[],values=[];
let skillsHTML="";

data.skills.forEach(s=>{
labels.push(s.name);
values.push(s.percent);
skillsHTML+=`${s.name} (${s.level}) <div class="skill-bar"><div class="skill-fill" style="width:${s.percent}%">${s.percent}%</div></div>`;
});

document.getElementById("skills").innerHTML=skillsHTML;

new Chart(document.getElementById("chart"),{
type:"pie",
data:{labels:labels,datasets:[{data:values}]}
});

document.getElementById("ai").innerText=data.ai_feedback;
}
</script>

</body>
</html>
